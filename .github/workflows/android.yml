name: Android CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual CI run'
        required: false
        default: 'Manual CI run'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Test and package OSS debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Read versions from gradle.properties
        run: |
          GO_VERSION=$(grep '^de\.schuelken\.cloudbridge\.goVersion=' gradle.properties | cut -d'=' -f2)
          NDK_VERSION=$(grep '^de\.schuelken\.cloudbridge\.ndkVersion=' gradle.properties | cut -d'=' -f2)
          if [[ ! "$GO_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Invalid Go version in gradle.properties"
            exit 1
          fi
          if [[ ! "$NDK_VERSION" =~ ^[0-9]+(\.[0-9]+){2,3}$ ]]; then
            echo "::error::Invalid NDK version in gradle.properties"
            exit 1
          fi
          printf 'GO_VERSION=%s\n' "$GO_VERSION" >> "$GITHUB_ENV"
          printf 'NDK_VERSION=%s\n' "$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install NDK
        run: |
          echo "Installing NDK version: ${{ env.NDK_VERSION }}"
          sdkmanager "ndk;${{ env.NDK_VERSION }}"

      - name: Run OSS debug unit tests and package debug APK
        run: |
          ./gradlew \
            :app:testReleaseSigningCertificateFingerprintPolicy \
            :app:testProductionReleaseSigningTaskWiring \
            :app:testOssDebugUnitTest \
            :app:assembleOssDebug

      - name: Generate debug APK provenance manifest
        run: |
          python3 rclone/create-debug-provenance.py \
            --repo-root . \
            --apk-dir app/build/outputs/apk/oss/debug \
            --output app/build/outputs/apk/oss/debug/provenance-manifest.json

      - name: Upload OSS debug APKs and provenance manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudbridge-oss-debug-build
          path: app/build/outputs/apk/oss/debug/
          if-no-files-found: error
          retention-days: 7

      - name: List debug APKs
        run: |
          find app/build/outputs/apk/oss/debug -name '*.apk' -exec ls -lh {} \;
