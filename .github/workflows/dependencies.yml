name: Verify dependency chain

on:
  pull_request:
    paths: ['**/*.gradle', 'gradle.properties', 'gradle/**', '.github/workflows/dependencies.yml']
  push:
    branches: [master, 'feat/**']
    paths: ['**/*.gradle', 'gradle.properties', 'gradle/**', '.github/workflows/dependencies.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Resolve reviewed runtime dependency graph
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --console=plain :app:dependencies --configuration ossReleaseRuntimeClasspath > dependency-report.txt
          if grep -E 'FAILED|Could not resolve' dependency-report.txt; then exit 1; fi
          if grep -Ei 'firebase-analytics|play-services-ads|facebook-android-sdk|com\.appsflyer|com\.adjust\.sdk' dependency-report.txt; then
            echo 'Unexpected advertising or tracking dependency requires explicit review.'
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-dependency-provenance
          path: dependency-report.txt
          if-no-files-found: error
          retention-days: 30
