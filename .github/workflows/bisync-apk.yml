name: Bisync debug APK

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3
        with:
          distribution: temurin
          java-version: '17'
      - name: Read pinned Go requirement
        id: go
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^de\.schuelken\.cloudbridge\.goVersion=//p' gradle.properties)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: false
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Build four architectures and universal APK
        run: ./gradlew --console=plain assembleOssDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bisync-debug-apks
          path: |
            app/build/outputs/apk/oss/debug/*.apk
            app/build/generated/rcloneAssets/*
          if-no-files-found: error
          retention-days: 14
