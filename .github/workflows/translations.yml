name: Translations

on:
  workflow_dispatch:
  pull_request:

jobs:
  string-change-verification:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changeDetection.outputs.should-run }}
      files: ${{ steps.changeDetection.outputs.files }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c # v46
      - name: Detect changed translation files
        id: changeDetection
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          SEARCH='strings.xml'
          CHANGEDFILES=''
          for file in ${ALL_CHANGED_FILES}; do
            if [[ "$file" == *values-*"$SEARCH" ]]; then
              echo "$file was changed"
              CHANGEDFILES="${CHANGEDFILES} $file"
              echo "should-run=true" >> $GITHUB_OUTPUT 
            fi
          done
          echo "files=$CHANGEDFILES" >> $GITHUB_OUTPUT 

  checkTranslations:
    runs-on: ubuntu-latest
    needs: string-change-verification
    if: needs.string-change-verification.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        locale: [ca, de, zh-CN]
        chunk: [1, 2, 3, 4]
        include:
          - locale: ca
            file: app/src/main/res/values-ca/strings.xml
            lang: ca|en
          - locale: de
            file: app/src/main/res/values-de/strings.xml
            lang: de|en
          - locale: zh-CN
            file: app/src/main/res/values-zh-rCN/strings.xml
            lang: zh-CN|en
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Prepare Profanity Check
        id: prep
        if: contains(needs.string-change-verification.outputs.files, matrix.file)
        env:
          TRANSLATION_CHUNK_INDEX: ${{ matrix.chunk }}
          TRANSLATION_CHUNK_SIZE: 4500
        run: |
          sudo apt-get install -y xmlstarlet
          pip3 install alt-profanity-check
          chmod +x ./scripts/checkProfanity.py
          chmod +x ./scripts/generateFilelist.sh
          FILE_LIST="${{ matrix.file }}"
          if [ -z "$FILE_LIST" ]; then
            echo "No changed translation files were provided."
            exit 1
          fi
          TRANSLATIONS=$(./scripts/generateFilelist.sh "${{ github.event.pull_request.commits }}" "$FILE_LIST")
          if [ -n "$TRANSLATIONS" ]; then
            echo 'has_text=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_text=false' >> "$GITHUB_OUTPUT"
          fi
          {
            echo 'TRANSLATIONS<<TRANSLATIONS_EOF'
            printf '%s\n' "$TRANSLATIONS"
            echo 'TRANSLATIONS_EOF'
          } >> "$GITHUB_OUTPUT"
        shell: sh
      - uses: fabasoad/translation-action@1476a9db97feaa816029bc027103eb89f3b017bf # v4.2.4
        id: google-translate
        if: steps.prep.outputs.has_text == 'true'
        with:
          provider: google
          lang: ${{ matrix.lang }}
          source: ${{ steps.prep.outputs.TRANSLATIONS }}
      - name: Print the result
        if: steps.google-translate.outcome == 'success'
        run: |
          echo "Translations are: '${{ steps.google-translate.outputs.text }}'"
          echo "${{ steps.google-translate.outputs.text }}" | sed 's/ ; /\n/g' > translated_texts.txt
          ./scripts/checkProfanity.py translated_texts.txt
        shell: sh
      - name: Upload Raw Translations
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.google-translate.outcome == 'success'
        with:
          name: Translations-${{ matrix.locale }}-${{ matrix.chunk }}
          path: |
            changed_texts.txt
            translated_texts.txt
            suspicious_texts.txt
      - name: Fail if there are suspected profanities
        if: steps.google-translate.outcome == 'success'
        run: |
          if [ -s "suspicious_texts.txt" ]; then
            echo "We found suspicious translations. Please check!"
            exit 1
          fi
        shell: sh
            
