// This is the rclone build script. It can build rclone binaries for any target
// architecture on any target architecture.
//
// Supported Android targets:
//  - arm-v8a (64 bit arm)
//  - arm-v7a (32 bit arm7)
//  - x86 (32 bit)
//  - x64 (64 bit)
//
// Supported host systems:
//  - linux x64
//  - macOS x64
//  - macOS arm64 (Silicon)
//  - windows x64
//
// Prerequisites:
//  - go 1.26+
//  - Either Android SDK command-line tools, or the expected NDK version (see gradle.properties).
//
// rclone source:
//  Cloned from the URL and ref specified in gradle.properties
//  (de.schuelken.cloudbridge.rCloneRepoUrl and rCloneRef).
//  To upgrade: change rCloneRef (or rCloneRepoUrl) and rebuild.


import java.nio.file.Paths

ext {
    NDK_VERSION = project.properties['de.schuelken.cloudbridge.ndkVersion']
    NDK_TOOLCHAIN_VERSION = project.properties['de.schuelken.cloudbridge.ndkToolchainVersion']
    RCLONE_VERSION = project.properties['de.schuelken.cloudbridge.rCloneVersion']
    GO_REQ_VERSION = project.properties['de.schuelken.cloudbridge.goVersion']

    RCLONE_REPO_URL = project.findProperty('de.schuelken.cloudbridge.rCloneRepoUrl') ?: 'https://github.com/rclone/rclone.git'
    RCLONE_REF = project.findProperty('de.schuelken.cloudbridge.rCloneRef') ?: "v${RCLONE_VERSION}"

    PROJECT_DIR = projectDir.absolutePath
    CACHE_PATH = Paths.get(PROJECT_DIR, 'cache').toString()
    GOPATH = Paths.get(CACHE_PATH, 'gopath').toString()
    OUTPUT_BASE_PATH = Paths.get(PROJECT_DIR, '..', 'app', 'lib').toAbsolutePath().toString()
}

def findSdkDir() {
    def androidHome = System.getenv('ANDROID_HOME')
    if (androidHome != null) {
        return androidHome
    }

    def localPropertiesFile = project.rootProject.file('local.properties')
    if (localPropertiesFile.exists()) {
        Properties properties = new Properties()
        properties.load(localPropertiesFile.newDataInputStream())
        def sdkDir = properties.get('sdk.dir')
        if (sdkDir != null) {
            return sdkDir
        }
    }

    throw new GradleException(
        "Couldn't locate your android SDK. Make sure you set sdk.dir property"
        + " in your local.properties at the root of the project or set"
        + " ANDROID_HOME environment variable."
    )
}

def findNdkDir() {
    def sdkDir = findSdkDir()
    def ndkPath = Paths.get(sdkDir, 'ndk', NDK_VERSION).toAbsolutePath()
    if (!ndkPath.toFile().exists()) {
        def sdkManagerPath = Paths.get(
            sdkDir,
            'cmdline-tools',
            'latest',
            'bin',
            'sdkmanager'
        ).toString()
        if (System.properties['os.name'].startsWith('Windows')) {
            sdkManagerPath += '.bat'
        }
        try {
            exec {
                commandLine sdkManagerPath, "--install", "ndk;${NDK_VERSION}"
            }
        } catch (exc) {
            logger.error(exc.toString())
            throw new GradleException(
                "Couldn't find a ndk bundle in ${ndkPath.toString()}. Make sure that you have the"
                + " proper version installed in Android Studio's SDK Manager or run"
                + " \"${sdkManagerPath} --install 'ndk;${NDK_VERSION}'\"."
            )
        }
    }
    return ndkPath.toString()
}

def getCrossCompiler(abi) {
    def osName = System.properties['os.name']
    def osArch = System.getProperty('os.arch')
    def os = null
    def isWindows = osName.startsWith('Windows')
    if (isWindows && osArch == 'amd64') {
        os = 'windows-x86_64'
    } else if (osName.startsWith('Linux') && (osArch == 'amd64' || osArch == 'aarch64' || osArch == 'arm64')) {
        os = 'linux-x86_64'
    } else if (osName.startsWith('Mac') && ['aarch64', 'amd64'].contains(osArch)) {
        os = 'darwin-x86_64'
    }
    if (os == null) {
        throw new GradleException('Unsupported host OS or architecture.')
    }

    def abiToCompiler = [
        'armeabi-v7a': "armv7a-linux-androideabi${NDK_TOOLCHAIN_VERSION}-clang",
        'arm64-v8a': "aarch64-linux-android${NDK_TOOLCHAIN_VERSION}-clang",
        'x86': "i686-linux-android${NDK_TOOLCHAIN_VERSION}-clang",
        'x86_64': "x86_64-linux-android${NDK_TOOLCHAIN_VERSION}-clang",
    ]

    def compilerName = abiToCompiler[abi]
    if (isWindows) {
        compilerName += '.cmd'
    }

    return Paths.get(
        findNdkDir(),
        'toolchains',
        'llvm',
        'prebuilt',
        os,
        'bin',
        compilerName,
    ).toString()
}

def getCC(abi) {
    if (System.properties['os.name'].startsWith('Windows')) {
        // cgo executes binaries directly; the NDK .cmd wrappers are not executables.
        def target = [
            'armeabi-v7a': 'armv7a-linux-androideabi',
            'arm64-v8a': 'aarch64-linux-android',
            'x86': 'i686-linux-android',
            'x86_64': 'x86_64-linux-android',
        ][abi]
        def compiler = Paths.get(findNdkDir(), 'toolchains', 'llvm', 'prebuilt',
                                 'windows-x86_64', 'bin', 'clang.exe').toString()
        return '"' + compiler + '" --target=' + target + NDK_TOOLCHAIN_VERSION
    }
    return '"' + getCrossCompiler(abi) + '"'
}

def getOutputPath(abi) {
    return Paths.get(OUTPUT_BASE_PATH, abi, 'librclone.so').toString()
}

def getSourceVersion() {
    def versionFile = Paths.get(CACHE_PATH, 'rclone-src', 'VERSION').toFile()
    if (versionFile.exists()) {
        return versionFile.text.trim()
    }
    return RCLONE_VERSION
}

def buildRclone(abi) {
    def abiToEnv = [
        'armeabi-v7a': ['GOARCH': 'arm', 'GOARM': '7'],
        'arm64-v8a': ['GOARCH': 'arm64'],
        'x86': ['GOARCH': '386'],
        'x86_64': ['GOARCH': 'amd64'],
    ]

    return {
        // Native tools write these files outside Gradle. Declared outputs invalidate the
        // virtual filesystem before Android snapshots/merges them for packaging.
        inputs.property('engineRepository', RCLONE_REPO_URL)
        inputs.property('engineCommit', RCLONE_REF)
        inputs.property('abi', abi)
        inputs.property('requiredGoVersion', GO_REQ_VERSION)
        inputs.property('actualGoVersion', { project.ext.resolvedGoVersion })
        inputs.property('ndkVersion', NDK_VERSION)
        inputs.property('androidApi', NDK_TOOLCHAIN_VERSION)
        inputs.property('buildMode', 'android-cgo-pie-noselfupdate-16k')
        inputs.files(fileTree(Paths.get(CACHE_PATH, 'rclone-src').toFile()) {
            exclude '.git/**'
        }).withPropertyName('engineSource').withPathSensitivity(PathSensitivity.RELATIVE)
        outputs.file(getOutputPath(abi)).withPropertyName('nativeExecutable')
        doLast {
            def commonEnv = [
                'GOPATH'      : GOPATH,
                'GOOS'        : 'android',
                'CGO_ENABLED' : '1',
                'CC'          : getCC(abi),
            ] + abiToEnv[abi]

            exec {
                commonEnv.each { k, v -> environment k, v }
                workingDir Paths.get(CACHE_PATH, 'rclone-src').toString()
                def ldflags = "-s -w -linkmode=external -extldflags=-Wl,-z,max-page-size=16384 -X github.com/rclone/rclone/fs.Version=${getSourceVersion()}"
                commandLine (
                    'go',
                    'build',
                    '-buildmode=pie',
                    '-tags',
                    'noselfupdate',
                    '-trimpath',
                    '-ldflags',
                    ldflags,
                    '-o',
                    getOutputPath(abi),
                    '.'
                )
            }
        }
    }
}

task createRcloneModule {
    onlyIf { !Paths.get(CACHE_PATH, 'go.mod').toFile().exists() }
    doLast {
        Paths.get(CACHE_PATH).toFile().mkdirs()
        exec {
            workingDir CACHE_PATH
            environment 'GOPATH', GOPATH
            commandLine 'go', 'mod', 'init', 'rclone'
        }
    }
}

task checkoutRclone(dependsOn: createRcloneModule) {
    doLast {
        def goVersionOutput = new ByteArrayOutputStream()
        exec {
            commandLine 'go', 'version'
            standardOutput = goVersionOutput
        }
        project.ext.resolvedGoVersion = goVersionOutput.toString().trim()

        // BUILD-019: fail the build on an incompatible Go toolchain, which would produce an
        // untested/broken librclone.so. Accept any patch of the required minor (e.g. a "1.26.0"
        // requirement accepts "1.26.11") and any newer minor, since Go stays forward-compatible.
        def goMatcher = goVersionOutput.toString() =~ /go(\d+)\.(\d+)\.(\d+)/
        if (!goMatcher.find()) {
            throw new GradleException("Unable to determine Go version from: ${goVersionOutput}")
        }
        def installedMajor = goMatcher[0][1] as int
        def installedMinor = goMatcher[0][2] as int
        def reqParts = GO_REQ_VERSION.tokenize('.')
        def reqMajor = reqParts[0] as int
        def reqMinor = reqParts.size() > 1 ? (reqParts[1] as int) : 0
        if (installedMajor > reqMajor || (installedMajor == reqMajor && installedMinor >= reqMinor)) {
            println "You are running a compatible Go version (${GO_REQ_VERSION} required, got ${goMatcher[0][0]})."
        } else {
            throw new GradleException("The required go version is: ${GO_REQ_VERSION}. You are running: ${goVersionOutput}")
        }

        if (!(RCLONE_REF ==~ /[0-9a-fA-F]{40}/)) {
            throw new GradleException('rCloneRef must be an immutable full commit SHA.')
        }
        def srcDir = Paths.get(CACHE_PATH, 'rclone-src').toFile()

        if (!srcDir.exists()) {
            println "Cloning rclone from ${RCLONE_REPO_URL} (ref: ${RCLONE_REF}) ..."
            exec {
                workingDir CACHE_PATH
                commandLine 'git', 'clone', '--no-tags', RCLONE_REPO_URL, 'rclone-src'
            }
        }

        // A cache made for a different fork must fetch from the selected origin.
        exec {
            workingDir srcDir.absolutePath
            commandLine 'git', 'remote', 'set-url', 'origin', RCLONE_REPO_URL
        }
        def dirtyOutput = new ByteArrayOutputStream()
        exec {
            workingDir srcDir.absolutePath
            commandLine 'git', 'status', '--porcelain'
            standardOutput = dirtyOutput
        }
        if (!dirtyOutput.toString().trim().isEmpty()) {
            throw new GradleException('Cached rclone source is modified. Preserve your changes and clear the cache before building.')
        }
        // Always sync to the requested ref so upgrades work without manual cache clears
        println "Syncing rclone source to ref: ${RCLONE_REF}"
        exec {
            workingDir srcDir.absolutePath
            commandLine 'git', 'fetch', 'origin', '--tags'
        }
        exec {
            workingDir srcDir.absolutePath
            commandLine 'git', 'checkout', '--detach', RCLONE_REF
        }

        // Print resolved commit and version for traceability
        def commitOut = new ByteArrayOutputStream()
        exec {
            workingDir srcDir.absolutePath
            commandLine 'git', 'rev-parse', 'HEAD'
            standardOutput = commitOut
        }
        if (!commitOut.toString().trim().equalsIgnoreCase(RCLONE_REF)) {
            throw new GradleException('Resolved engine SHA does not match requested source.')
        }
        def version = getSourceVersion()
        println "rclone source: commit=${commitOut.toString().trim()} version=${version} (from ${RCLONE_REPO_URL})"
    }
}

task buildArm(dependsOn: checkoutRclone) {
    configure buildRclone('armeabi-v7a')
}

task buildArm64(dependsOn: checkoutRclone) {
    configure buildRclone('arm64-v8a')
}

task buildx86(dependsOn: checkoutRclone) {
    configure buildRclone('x86')
}

task buildx64(dependsOn: checkoutRclone) {
    configure buildRclone('x86_64')
}

task generateProvenance(dependsOn: [buildArm, buildArm64, buildx86, buildx64]) {
    inputs.property('engineRepository', RCLONE_REPO_URL)
    inputs.property('engineCommit', RCLONE_REF)
    inputs.property('ndkVersion', NDK_VERSION)
    inputs.property('androidApi', NDK_TOOLCHAIN_VERSION)
    inputs.property('requiredGoVersion', GO_REQ_VERSION)
    inputs.property('actualGoVersion', { project.ext.resolvedGoVersion })
    inputs.files([buildArm, buildArm64, buildx86, buildx64]).withPropertyName('nativeExecutables')
    inputs.files(['VERSION', 'go.mod', 'go.sum'].collect {
        Paths.get(CACHE_PATH, 'rclone-src', it).toFile()
    }).withPropertyName('dependencyInputs').withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.file(rootProject.file('app/build/generated/rcloneProvenance/rclone-build.json'))
            .withPropertyName('engineProvenance')
    doLast {
        def goVersion = new ByteArrayOutputStream()
        exec { commandLine 'go', 'version'; standardOutput = goVersion }
        def manifest = [repository: RCLONE_REPO_URL, commit: RCLONE_REF,
                        version: getSourceVersion(), go: goVersion.toString().trim(),
                        ndk: NDK_VERSION, androidApi: NDK_TOOLCHAIN_VERSION, goos: 'android',
                        cgo: true, buildMode: 'pie', maxPageSize: 16384,
                        buildTags: ['noselfupdate'], binaries: [:]]
        manifest.dependencyInputs = [:]
        ['go.mod', 'go.sum'].each { name ->
            def dependencyFile = Paths.get(CACHE_PATH, 'rclone-src', name).toFile()
            manifest.dependencyInputs[name] = java.security.MessageDigest.getInstance('SHA-256')
                    .digest(dependencyFile.bytes).encodeHex().toString()
        }
        ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'].each { abi ->
            def binary = new File(getOutputPath(abi))
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            binary.withInputStream { stream ->
                byte[] buffer = new byte[65536]
                int length
                while ((length = stream.read(buffer)) != -1) digest.update(buffer, 0, length)
            }
            manifest.binaries[abi] = [sha256: digest.digest().encodeHex().toString(), bytes: binary.length()]
        }
        def destination = rootProject.file('app/build/generated/rcloneProvenance/rclone-build.json')
        destination.parentFile.mkdirs()
        destination.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest))
    }
}

task buildAll { dependsOn generateProvenance }

task clean {
    doLast {
        exec {
            environment 'GOPATH', GOPATH
            commandLine 'go', 'clean', '-cache', '-testcache', '-modcache', '-fuzzcache'
        }
        delete CACHE_PATH
        delete fileTree(OUTPUT_BASE_PATH).matching {
            include '**/librclone.so'
        }
    }
}

defaultTasks 'buildAll'
