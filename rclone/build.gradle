// This is the rclone build script. It can build rclone binaries for any target
// architecture on any target architecture.
//
// Supported Android targets:
//  - arm-v8a (64 bit arm)
//  - arm-v7a (32 bit arm7)
//  - x86 (32 bit)
//  - x64 (64 bit)
//
// Supported host systems:
//  - linux x64
//  - macOS x64
//  - macOS arm64 (Silicon)
//  - windows x64
//
// Prerequisites:
//  - go 1.26+
//  - Either Android SDK command-line tools, or the expected NDK version (see gradle.properties).
//
// rclone source:
//  Cloned from the URL and ref specified in gradle.properties
//  (de.schuelken.cloudbridge.rCloneRepoUrl and rCloneRef).
//  To upgrade: change rCloneRef (or rCloneRepoUrl) and rebuild.


import groovy.json.JsonOutput
import java.nio.file.Paths
import java.net.URI

ext {
    NDK_VERSION = project.properties['de.schuelken.cloudbridge.ndkVersion']
    NDK_TOOLCHAIN_VERSION = project.properties['de.schuelken.cloudbridge.ndkToolchainVersion']
    RCLONE_VERSION = project.properties['de.schuelken.cloudbridge.rCloneVersion']
    GO_REQ_VERSION = project.properties['de.schuelken.cloudbridge.goVersion']

    def configuredRepoUrl = project.findProperty('de.schuelken.cloudbridge.rCloneRepoUrl')?.toString()?.trim()
    def configuredRef = project.findProperty('de.schuelken.cloudbridge.rCloneRef')?.toString()?.trim()
    if (!configuredRepoUrl) {
        throw new GradleException('Missing required de.schuelken.cloudbridge.rCloneRepoUrl; refusing an unpinned rclone fallback')
    }
    if (!configuredRef) {
        throw new GradleException('Missing required de.schuelken.cloudbridge.rCloneRef; refusing an unpinned rclone fallback')
    }
    if (!(configuredRef ==~ /(?i)[0-9a-f]{40}/)) {
        throw new GradleException('Rclone must be pinned to a full immutable 40-character commit SHA')
    }
    RCLONE_REPO_URL = configuredRepoUrl
    RCLONE_REF = configuredRef

    def configuredGo = project.findProperty('de.schuelken.cloudbridge.goExecutable')?.toString()?.trim()
    def goRoot = System.getenv('GOROOT')?.trim()
    def goBinary = System.properties['os.name'].startsWith('Windows') ? 'go.exe' : 'go'
    def goFromRoot = goRoot ? Paths.get(goRoot, 'bin', goBinary).toAbsolutePath() : null
    GO_EXECUTABLE = configuredGo
        ? project.file(configuredGo).absolutePath
        : (goFromRoot != null && goFromRoot.toFile().isFile() ? goFromRoot.toString() : 'go')

    PROJECT_DIR = projectDir.absolutePath
    CACHE_PATH = Paths.get(PROJECT_DIR, 'cache').toString()
    GOPATH = Paths.get(CACHE_PATH, 'gopath').toString()
    OUTPUT_BASE_PATH = Paths.get(PROJECT_DIR, '..', 'app', 'lib').toAbsolutePath().toString()
}

def sanitizeRepositoryUrl = { String repositoryUrl ->
    try {
        def uri = new URI(repositoryUrl)
        if (uri.scheme && uri.host) {
            return new URI(uri.scheme, null, uri.host, uri.port, uri.path, null, null).toASCIIString()
        }
    } catch (Exception ignored) {
        // Fall through to safe handling for SCP-style Git URLs and local paths.
    }

    if (!(repositoryUrl ==~ /^[A-Za-z]:[\\/].*/)) {
        def scpMatcher = repositoryUrl =~ /^(?:[^@\/]+@)?([^:\/]+):(.+)$/
        if (scpMatcher.matches()) {
            return "${scpMatcher[1]}:${scpMatcher[2].replaceAll(/[?#].*$/, '')}"
        }
    }
    return 'configured repository (identifier omitted)'
}

def findSdkDir() {
    def androidHome = System.getenv('ANDROID_HOME')
    if (androidHome != null) {
        return androidHome
    }

    def localPropertiesFile = project.rootProject.file('local.properties')
    if (localPropertiesFile.exists()) {
        Properties properties = new Properties()
        properties.load(localPropertiesFile.newDataInputStream())
        def sdkDir = properties.get('sdk.dir')
        if (sdkDir != null) {
            return sdkDir
        }
    }

    throw new GradleException(
        "Couldn't locate your android SDK. Make sure you set sdk.dir property"
        + " in your local.properties at the root of the project or set"
        + " ANDROID_HOME environment variable."
    )
}

def findNdkDir() {
    def sdkDir = findSdkDir()
    def ndkPath = Paths.get(sdkDir, 'ndk', NDK_VERSION).toAbsolutePath()
    if (!ndkPath.toFile().exists()) {
        def sdkManagerPath = Paths.get(
            sdkDir,
            'cmdline-tools',
            'latest',
            'bin',
            'sdkmanager'
        ).toString()
        if (System.properties['os.name'].startsWith('Windows')) {
            sdkManagerPath += '.bat'
        }
        try {
            exec {
                commandLine sdkManagerPath, "--install", "ndk;${NDK_VERSION}"
            }
        } catch (exc) {
            logger.error(exc.toString())
            throw new GradleException(
                "Couldn't find a ndk bundle in ${ndkPath.toString()}. Make sure that you have the"
                + " proper version installed in Android Studio's SDK Manager or run"
                + " \"${sdkManagerPath} --install 'ndk;${NDK_VERSION}'\"."
            )
        }
    }
    return ndkPath.toString()
}

def getCrossCompiler(abi) {
    def osName = System.properties['os.name']
    def osArch = System.getProperty('os.arch')
    def os = null
    def isWindows = osName.startsWith('Windows')
    if (isWindows && osArch == 'amd64') {
        os = 'windows-x86_64'
    } else if (osName.startsWith('Linux') && (osArch == 'amd64' || osArch == 'aarch64' || osArch == 'arm64')) {
        os = 'linux-x86_64'
    } else if (osName.startsWith('Mac') && ['aarch64', 'amd64'].contains(osArch)) {
        os = 'darwin-x86_64'
    }
    if (os == null) {
        throw new GradleException('Unsupported host OS or architecture.')
    }

    def abiToCompiler = [
        'armeabi-v7a': "armv7a-linux-androideabi${NDK_TOOLCHAIN_VERSION}-clang",
        'arm64-v8a': "aarch64-linux-android${NDK_TOOLCHAIN_VERSION}-clang",
        'x86': "i686-linux-android${NDK_TOOLCHAIN_VERSION}-clang",
        'x86_64': "x86_64-linux-android${NDK_TOOLCHAIN_VERSION}-clang",
    ]

    def compilerName = abiToCompiler[abi]
    if (isWindows) {
        compilerName += '.cmd'
    }

    return Paths.get(
        findNdkDir(),
        'toolchains',
        'llvm',
        'prebuilt',
        os,
        'bin',
        compilerName,
    ).toString()
}

def getCC(abi) {
    def osName = System.properties['os.name']
    if (osName.startsWith('Windows')) {
        return null
    }
    return getCrossCompiler(abi)
}

def getOutputPath(abi) {
    return Paths.get(OUTPUT_BASE_PATH, abi, 'librclone.so').toString()
}

def getSourceVersion() {
    def versionFile = Paths.get(CACHE_PATH, 'rclone-src', 'VERSION').toFile()
    if (versionFile.exists()) {
        return versionFile.text.trim()
    }
    return RCLONE_VERSION
}

def buildRclone(abi) {
    def abiToEnv = [
        'armeabi-v7a': ['GOARCH': 'arm', 'GOARM': '7'],
        'arm64-v8a': ['GOARCH': 'arm64'],
        'x86': ['GOARCH': '386'],
        'x86_64': ['GOARCH': 'amd64'],
    ]

    return {
        doLast {
            def goCache = Paths.get(CACHE_PATH, 'gocache')
            def goTemp = Paths.get(CACHE_PATH, 'gotmp')
            goCache.toFile().mkdirs()
            goTemp.toFile().mkdirs()
            def commonEnv = [
                'GOPATH'      : GOPATH,
                'GOCACHE'     : goCache.toString(),
                'GOTMPDIR'    : goTemp.toString(),
                // This checkout is an independently pinned module, not a member of the
                // host's workspace (which may contain local review/test replacements).
                'GOWORK'      : 'off',
                'GOOS'        : 'linux',
                'CGO_ENABLED' : '0',
            ] + abiToEnv[abi]

            exec {
                commonEnv.each { k, v -> environment k, v }
                workingDir Paths.get(CACHE_PATH, 'rclone-src').toString()
                def ldflags = "-s -w -X github.com/rclone/rclone/fs.Version=${getSourceVersion()}"
                commandLine (
                    GO_EXECUTABLE,
                    'build',
                    // Repository and full commit provenance are verified and printed by this task;
                    // keep Go's automatic VCS stamping independent of host Git ownership rules.
                    '-buildvcs=false',
                    '-tags',
                    'noselfupdate',
                    '-trimpath',
                    '-ldflags',
                    ldflags,
                    '-o',
                    getOutputPath(abi),
                    '.'
                )
            }
        }
    }
}

task createRcloneModule {
    onlyIf { !Paths.get(CACHE_PATH, 'go.mod').toFile().exists() }
    doLast {
        Paths.get(CACHE_PATH).toFile().mkdirs()
        exec {
            workingDir CACHE_PATH
            environment 'GOPATH', GOPATH
            commandLine GO_EXECUTABLE, 'mod', 'init', 'rclone'
        }
    }
}

task checkoutRclone(dependsOn: createRcloneModule) {
    doLast {
        def goVersionOutput = new ByteArrayOutputStream()
        exec {
            commandLine GO_EXECUTABLE, 'version'
            standardOutput = goVersionOutput
        }

        // BUILD-019: fail the build on an incompatible Go toolchain, which would produce an
        // untested/broken librclone.so. Accept any patch of the required minor (e.g. a "1.25.0"
        // requirement accepts "1.25.11") and any newer minor, since Go stays forward-compatible.
        def goMatcher = goVersionOutput.toString() =~ /go(\d+)\.(\d+)\.(\d+)/
        if (!goMatcher.find()) {
            throw new GradleException("Unable to determine Go version from: ${goVersionOutput}")
        }
        def installedMajor = goMatcher[0][1] as int
        def installedMinor = goMatcher[0][2] as int
        def reqParts = GO_REQ_VERSION.tokenize('.')
        def reqMajor = reqParts[0] as int
        def reqMinor = reqParts.size() > 1 ? (reqParts[1] as int) : 0
        if (installedMajor > reqMajor || (installedMajor == reqMajor && installedMinor >= reqMinor)) {
            println "You are running a compatible Go version (${GO_REQ_VERSION} required, got ${goMatcher[0][0]})."
        } else {
            throw new GradleException("The required go version is: ${GO_REQ_VERSION}. You are running: ${goVersionOutput}")
        }

        def srcDir = Paths.get(CACHE_PATH, 'rclone-src').toFile()

        if (!srcDir.exists()) {
            println "Cloning rclone from ${sanitizeRepositoryUrl(RCLONE_REPO_URL)} (ref: ${RCLONE_REF}) ..."
            exec {
                workingDir CACHE_PATH
                commandLine 'git', 'clone', '--no-tags', RCLONE_REPO_URL, 'rclone-src'
            }
        }

        def originOut = new ByteArrayOutputStream()
        exec {
            workingDir srcDir.absolutePath
            commandLine 'git', 'config', '--get', 'remote.origin.url'
            standardOutput = originOut
        }
        def resolvedOrigin = originOut.toString().trim()
        if (resolvedOrigin != RCLONE_REPO_URL) {
            throw new GradleException(
                'Cached rclone origin does not match the configured repository; refusing a potentially stale source cache'
            )
        }

        // Refresh only the source refs used by the reachability check. Pruning ensures a
        // deleted or force-updated remote ref left in the cache cannot validate an old pin.
        println "Refreshing rclone branches and tags for ${RCLONE_REF}"
        exec {
            workingDir srcDir.absolutePath
            commandLine 'git', 'fetch', '--prune', 'origin',
                '+refs/heads/*:refs/cloudbridge/origin/heads/*',
                '+refs/tags/*:refs/cloudbridge/origin/tags/*'
        }

        def pinObjectResult = exec {
            workingDir srcDir.absolutePath
            commandLine 'git', 'cat-file', '-e', "${RCLONE_REF}^{commit}"
            ignoreExitValue = true
        }
        if (pinObjectResult.exitValue != 0) {
            throw new GradleException(
                "Configured rclone commit ${RCLONE_REF} is absent after refreshing remote refs"
            )
        }

        def reachableRefsOutput = new ByteArrayOutputStream()
        exec {
            workingDir srcDir.absolutePath
            commandLine 'git', 'for-each-ref', "--contains=${RCLONE_REF}",
                '--format=%(refname)', 'refs/cloudbridge/origin'
            standardOutput = reachableRefsOutput
        }
        def reachableRemoteRefs = reachableRefsOutput.toString().readLines()
            .collect { it.trim() }
            .findAll { !it.isEmpty() }
        if (reachableRemoteRefs.isEmpty()) {
            throw new GradleException(
                "Configured rclone commit ${RCLONE_REF} is not reachable from any refreshed origin branch or tag"
            )
        }

        exec {
            workingDir srcDir.absolutePath
            commandLine 'git', 'checkout', RCLONE_REF
        }

        // Verify the exact full commit before any native build and retain it in build output.
        def commitOut = new ByteArrayOutputStream()
        exec {
            workingDir srcDir.absolutePath
            commandLine 'git', 'rev-parse', '--verify', 'HEAD^{commit}'
            standardOutput = commitOut
        }
        def resolvedCommit = commitOut.toString().trim().toLowerCase(java.util.Locale.ROOT)
        if (resolvedCommit != RCLONE_REF.toLowerCase(java.util.Locale.ROOT)) {
            throw new GradleException(
                "Resolved rclone commit ${resolvedCommit} does not match configured pin ${RCLONE_REF}"
            )
        }
        def version = getSourceVersion()
        def safeRepository = sanitizeRepositoryUrl(resolvedOrigin)
        def provenanceFile = project.file("${project.buildDir}/rclone-provenance.json")
        provenanceFile.parentFile.mkdirs()
        def provenance = [
            schemaVersion: 1,
            artifactType: 'cloudbridge-rclone-source-provenance',
            repository: safeRepository,
            requestedCommit: RCLONE_REF.toLowerCase(java.util.Locale.ROOT),
            resolvedCommit: resolvedCommit,
            sourceVersion: version,
            rclonePinVerifiedAgainstRefreshedRemoteRefs: true,
            reachableRemoteRefCount: reachableRemoteRefs.size(),
            reachableRemoteRefs: reachableRemoteRefs,
            scope: 'Source checkout provenance only; not an APK build or release attestation.'
        ]
        provenanceFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(provenance)) + System.lineSeparator()
        println "rclone source: repository=${safeRepository} commit=${resolvedCommit} version=${version}"
        println "rclone provenance: ${provenanceFile.absolutePath}"
    }
}

task buildArm(dependsOn: checkoutRclone) {
    configure buildRclone('armeabi-v7a')
}

task buildArm64(dependsOn: checkoutRclone) {
    configure buildRclone('arm64-v8a')
}

task buildx86(dependsOn: checkoutRclone) {
    configure buildRclone('x86')
}

task buildx64(dependsOn: checkoutRclone) {
    configure buildRclone('x86_64')
}

task buildAll {
    dependsOn buildArm, buildArm64, buildx86, buildx64
}

task clean {
    doLast {
        exec {
            environment 'GOPATH', GOPATH
            commandLine GO_EXECUTABLE, 'clean', '-cache', '-testcache', '-modcache', '-fuzzcache'
        }
        delete CACHE_PATH
        delete fileTree(OUTPUT_BASE_PATH).matching {
            include '**/librclone.so'
        }
    }
}

defaultTasks 'buildAll'
