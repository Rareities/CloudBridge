// A pinned Android PIE executable uses bionic DNS, preserving Android Private DNS/VPN policy.
import groovy.json.JsonOutput
import java.security.MessageDigest

ext {
    RCLONE_REPO_URL = project.properties['io.github.rareities.protonbridge.rCloneRepoUrl']
    RCLONE_REF = project.properties['io.github.rareities.protonbridge.rCloneRef']
    GO_REQ_VERSION = project.properties['io.github.rareities.protonbridge.goVersion']
    CACHE_PATH = new File(projectDir, 'cache')
    SOURCE_PATH = new File(CACHE_PATH, 'rclone-src')
    OUTPUT_PATH = new File(rootProject.projectDir, 'app/lib')
    PROVENANCE_PATH = new File(rootProject.projectDir, 'app/build/generated/rcloneAssets')
}

def capture(List<String> arguments, File directory = projectDir) {
    def output = new ByteArrayOutputStream()
    exec { workingDir directory; commandLine arguments; standardOutput output }
    return output.toString('UTF-8').trim()
}

def hashFile(File file) {
    def digest = MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        byte[] buffer = new byte[65536]
        int count
        while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
    }
    return digest.digest().collect { String.format('%02x', it & 0xff) }.join('')
}

def targets = [
    'armeabi-v7a': [arch: 'arm', arm: '7', machine: 40, elfClass: 1, triple: 'armv7a-linux-androideabi'],
    'arm64-v8a': [arch: 'arm64', machine: 183, elfClass: 2, triple: 'aarch64-linux-android'],
    'x86': [arch: '386', machine: 3, elfClass: 1, triple: 'i686-linux-android'],
    'x86_64': [arch: 'amd64', machine: 62, elfClass: 2, triple: 'x86_64-linux-android'],
]

def androidCompiler(String triple) {
    def sdk = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
    if (!sdk) {
        def local = rootProject.file('local.properties')
        def settings = new Properties()
        if (local.isFile()) local.withInputStream { settings.load(it) }
        sdk = settings.getProperty('sdk.dir')
    }
    if (!sdk) throw new GradleException('Set ANDROID_HOME or sdk.dir before building the Android engine')
    def windows = System.getProperty('os.name').startsWith('Windows')
    def host = windows ? 'windows-x86_64' : System.getProperty('os.name').startsWith('Mac') ? 'darwin-x86_64' : 'linux-x86_64'
    def ndk = project.properties['io.github.rareities.protonbridge.ndkVersion']
    def api = project.properties['io.github.rareities.protonbridge.ndkToolchainVersion']
    if (api != '23') throw new GradleException('The engine minimum API must match the application minimum API 23')
    def compiler = new File(sdk, "ndk/${ndk}/toolchains/llvm/prebuilt/${host}/bin/clang${windows ? '.exe' : ''}")
    if (!compiler.isFile()) throw new GradleException("Install the pinned Android NDK: sdkmanager 'ndk;${ndk}'")
    return '"' + compiler.absolutePath + '" --target=' + triple + api
}

tasks.register('checkoutRclone') {
    doLast {
        if (!(RCLONE_REF ==~ /[0-9a-f]{40}/)) throw new GradleException('rCloneRef must be an immutable, full commit SHA')
        if (new URI(RCLONE_REPO_URL).userInfo != null) throw new GradleException('Do not embed credentials in rCloneRepoUrl')
        def go = capture(['go', 'version'])
        def matcher = go =~ /go(\d+)\.(\d+)\.(\d+)/
        if (!matcher.find()) throw new GradleException('Cannot determine installed Go version')
        def wanted = GO_REQ_VERSION.tokenize('.').collect { it as int }
        def major = matcher.group(1) as int
        def minor = matcher.group(2) as int
        def patch = matcher.group(3) as int
        if (major < wanted[0] || (major == wanted[0] && (minor < wanted[1] ||
                (minor == wanted[1] && patch < wanted[2]))))
            throw new GradleException("Go ${GO_REQ_VERSION} or newer is required; found ${go}")
        CACHE_PATH.mkdirs()
        if (!new File(SOURCE_PATH, '.git').isDirectory()) {
            if (SOURCE_PATH.exists() && SOURCE_PATH.list().length > 0)
                throw new GradleException('The engine cache is not a Git checkout; move it aside before rebuilding')
            SOURCE_PATH.mkdirs()
            exec { workingDir SOURCE_PATH; commandLine 'git', 'init' }
            exec { workingDir SOURCE_PATH; commandLine 'git', 'remote', 'add', 'origin', RCLONE_REPO_URL }
        } else {
            if (!capture(['git', 'status', '--porcelain'], SOURCE_PATH).isEmpty())
                throw new GradleException('The fetched engine checkout contains edits. Preserve them before changing the engine pin.')
            if (capture(['git', 'remote', 'get-url', 'origin'], SOURCE_PATH) != RCLONE_REPO_URL)
                exec { workingDir SOURCE_PATH; commandLine 'git', 'remote', 'set-url', 'origin', RCLONE_REPO_URL }
        }
        exec { workingDir SOURCE_PATH; commandLine 'git', 'fetch', '--depth=1', 'origin', RCLONE_REF }
        exec { workingDir SOURCE_PATH; commandLine 'git', 'checkout', '--detach', RCLONE_REF }
        if (capture(['git', 'rev-parse', 'HEAD'], SOURCE_PATH) != RCLONE_REF)
            throw new GradleException('Resolved engine commit does not match the approved pin')
        logger.lifecycle("Engine: ${RCLONE_REPO_URL} @ ${RCLONE_REF}; ${go}")
    }
}

def builds = []
targets.each { abi, target ->
    builds.add(tasks.register('build-' + abi) {
        dependsOn 'checkoutRclone'
        inputs.property('engineCommit', RCLONE_REF)
        inputs.property('engineRepository', RCLONE_REPO_URL)
        inputs.property('goRequirement', GO_REQ_VERSION)
        inputs.property('ndkVersion', project.properties['io.github.rareities.protonbridge.ndkVersion'])
        inputs.property('nativePolicy', 'android-cgo-pie-api23-16k')
        outputs.file(new File(OUTPUT_PATH, "${abi}/librclone.so"))
        // Record outputs so Gradle invalidates its virtual filesystem snapshots
        // after Go writes the native executables outside Gradle's file APIs.
        outputs.upToDateWhen { false }
        doLast {
            def destination = new File(OUTPUT_PATH, "${abi}/librclone.so")
            destination.parentFile.mkdirs()
            def sourceVersion = new File(SOURCE_PATH, 'VERSION').text.trim()
            exec {
                workingDir SOURCE_PATH
                environment 'GOOS', 'android'
                environment 'GOARCH', target.arch
                environment 'CGO_ENABLED', '1'
                environment 'CC', androidCompiler(target.triple)
                if (target.arm) environment 'GOARM', target.arm
                commandLine 'go', 'build', '-mod=readonly', '-buildvcs=true', '-buildmode=pie', '-tags', 'noselfupdate',
                        '-trimpath', '-ldflags', "-s -w -linkmode=external -extldflags=-Wl,-z,max-page-size=16384 -X github.com/rclone/rclone/fs.Version=${sourceVersion}-protonbridge.${RCLONE_REF.take(12)}",
                        '-o', destination.absolutePath, '.'
            }
            byte[] header = new byte[20]
            destination.withInputStream { if (it.read(header) != 20) throw new GradleException('Engine binary is truncated') }
            def machine = (header[18] & 0xff) | ((header[19] & 0xff) << 8)
            if (header[0] != 0x7f || header[1] != 0x45 || header[2] != 0x4c || header[3] != 0x46 ||
                    header[4] != target.elfClass || header[16] != 3 || header[17] != 0 || machine != target.machine)
                throw new GradleException("The generated binary is not the expected ${abi} ELF executable")
        }
    })
}

tasks.register('buildAll') {
    dependsOn builds
    outputs.dir(PROVENANCE_PATH)
    outputs.upToDateWhen { false }
    doLast {
        PROVENANCE_PATH.mkdirs()
        def outputs = targets.collect { abi, ignored ->
            def binary = new File(OUTPUT_PATH, "${abi}/librclone.so")
            [abi: abi, sha256: hashFile(binary), bytes: binary.length()]
        }
        def provenance = [schemaVersion: 1, repository: RCLONE_REPO_URL, commit: RCLONE_REF,
            sourceVersion: new File(SOURCE_PATH, 'VERSION').text.trim(), goToolchain: capture(['go', 'version']),
            goos: 'android', cgoEnabled: true, buildMode: 'pie', androidApi: 23, maxPageSize: 16384,
            ndkVersion: project.properties['io.github.rareities.protonbridge.ndkVersion'],
            buildTags: ['noselfupdate'], artifacts: outputs]
        new File(PROVENANCE_PATH, 'engine-provenance.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(provenance))
        new File(PROVENANCE_PATH, 'engine-modules.txt').text = capture(['go', 'list', '-m', '-mod=readonly',
            '-f', '{{.Path}} {{.Version}}{{if .Replace}} => {{.Replace.Path}} {{.Replace.Version}}{{end}}', 'all'], SOURCE_PATH) + '\n'
    }
}

tasks.register('clean') {
    doLast {
        // Only project-generated files are removed. Never clear the user's shared Go caches.
        delete CACHE_PATH
        delete PROVENANCE_PATH
        delete fileTree(OUTPUT_PATH).matching { include '**/librclone.so' }
    }
}

defaultTasks 'buildAll'
