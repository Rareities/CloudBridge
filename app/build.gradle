apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlinx-serialization'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def releaseStorePath = keystoreProperties['storeFile'] ?: System.getenv('CB_STORE_FILE')
def releaseAlias = keystoreProperties['keyAlias'] ?: System.getenv('CB_KEY_ALIAS')
def releaseStorePassword = keystoreProperties['storePassword'] ?: System.getenv('CB_STORE_PASSWORD')
def releaseKeyPassword = keystoreProperties['keyPassword'] ?: System.getenv('CB_KEY_PASSWORD')
def releaseKeyConfigured = releaseStorePath && file(releaseStorePath).isFile() &&
        releaseAlias && releaseStorePassword && releaseKeyPassword

def validateReleaseSigning = tasks.register('validateReleaseSigning') {
    doLast {
        if (!releaseKeyConfigured) {
            throw new GradleException('Release signing requires a keystore and all CB_* signing credentials. Use assembleOssDebug for unsigned development work.')
        }
        def keyStore = java.security.KeyStore.getInstance(file(releaseStorePath), releaseStorePassword.toCharArray())
        if (!keyStore.isKeyEntry(releaseAlias) || keyStore.getKey(releaseAlias, releaseKeyPassword.toCharArray()) == null) {
            throw new GradleException('Release signing alias must identify a usable private key.')
        }
        def certificate = keyStore.getCertificate(releaseAlias)
        if (!(certificate instanceof java.security.cert.X509Certificate) ||
                certificate.subjectX500Principal.name.toLowerCase(java.util.Locale.ROOT).contains('cn=android debug')) {
            throw new GradleException('An Android debug certificate cannot sign a release artifact.')
        }
    }
}
tasks.configureEach { candidate ->
    if (candidate.name ==~ /pre.*ReleaseBuild/) candidate.dependsOn(validateReleaseSigning)
}

android {
    // Official release tasks fail closed. Development builds retain their separate debug key.
    signingConfigs {
        release {
            if (releaseKeyConfigured) {
                keyAlias = releaseAlias
                storeFile file(releaseStorePath)
                storePassword = releaseStorePassword
                keyPassword = releaseKeyPassword
            }
        }
    }
    ndkVersion project.properties['de.schuelken.cloudbridge.ndkVersion']
    defaultConfig {
        generatedDensities = []
        vectorDrawables.generatedDensities = []
        applicationId 'de.schuelken.cloudbridge'
        minSdkVersion 23
        compileSdk 36
        targetSdkVersion 36
        // CI bumps these per beta via CB_VERSION_CODE / CB_VERSION_NAME env vars.
        // versionCode must end in 0 (last digit reserved for ABI offsets).
        versionCode System.getenv('CB_VERSION_CODE') ? System.getenv('CB_VERSION_CODE').toInteger() : 30
        versionName System.getenv('CB_VERSION_NAME') ? System.getenv('CB_VERSION_NAME') : '1.0.2'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "java.lang.String", "RCLONE_SOURCE_SHA", '"' + project.properties['de.schuelken.cloudbridge.rCloneRef'] + '"'
        buildConfigField "java.lang.String", "RCLONE_SOURCE_REPO", '"' + project.properties['de.schuelken.cloudbridge.rCloneRepoUrl'] + '"'
        buildConfigField "java.lang.String", "CLI", System.getenv('RCX_BUILD_CLI') ? System.getenv('RCX_BUILD_CLI') : "\"c03129b6-b09f-9cb4-8fcd-7f143b8f94ef\""
        buildConfigField "java.lang.String", "VCP_AUTHORITY", "\"" + applicationId + ".vcp\"";
        setProperty("archivesBaseName",  "cloudbridge_v"+versionName)

        externalNativeBuild {
            ndkBuild {
                arguments "LOCAL_LDFLAGS += -Wl,--build-id=none"
            }
        }
    }

    buildFeatures {
        viewBinding true
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            manifestPlaceholders = [
                    appIcon: "@mipmap/ic_launcher_debug",
                    appIconRound: "@mipmap/ic_launcher_debug_round"
            ]
        }
        release {
            minifyEnabled true
            shrinkResources true
            // Strip debug symbols from the packaged .so files; Play Console
            // extracts them for native (librclone) crash/ANR symbolization.
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [
                    appIcon: "@mipmap/ic_launcher",
                    appIconRound: "@mipmap/ic_launcher_round"
            ]
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        configureEach {
            jniLibs.srcDirs = ["lib"]
            assets.srcDir("$buildDir/generated/rcloneProvenance")
        }
    }

    flavorDimensions += 'edition'
    productFlavors {
        // Round-Sync edition flavor (currently identical to oss, kept for compatibility)
        rs {
            dimension 'edition'
        }
        // OSS build — the default for GitHub releases and Google Play
        oss {
            dimension 'edition'
        }
    }

    splits {
        abi {
            // AAB builds fail while APK splits are enabled; pass -PnoAbiSplits for bundleOssRelease
            enable !project.hasProperty('noAbiSplits')
            reset()
            include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }

    project.ext.versionCodes = [
        'armeabi-v7a': 6,
        'arm64-v8a'  : 7,
        'x86'        : 8,
        'x86_64'     : 9
    ]

    android.applicationVariants.all { variant ->
        variant.outputs.each { output ->
            output.versionCodeOverride =
                    project.ext.versionCodes.get(output.getFilter(com.android.build.OutputFile.ABI), 0) + android.defaultConfig.versionCode
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }
    packagingOptions {
        jniLibs {
            keepDebugSymbols += ['**/*.so']
            useLegacyPackaging true
        }
    }

    // Required for language picker
    androidResources {
        generateLocaleConfig true
    }

    buildTypes {
        getByName("debug") {
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-DEBUG"
            buildConfigField "java.lang.String", "VCP_AUTHORITY", "\"" + defaultConfig.applicationId + ".debug.vcp\"";
            resValue("string", "app_name", "CB Debug")
            resValue("string", "app_short_name", "CB Debug")
        }
    }

    lint {
        baseline = file("lint-baseline.xml")
        abortOnError = true
        warning 'MissingTranslation'

    }

    gradle.projectsEvaluated {
        preBuild.dependsOn(':rclone:buildAll')
        // Source sets refer to externally compiled files. Model the actual consumers,
        // not only preBuild, so their input snapshots always follow the producers.
        tasks.configureEach { candidate ->
            if (candidate.name ==~ /merge.*(?:JniLibFolders|NativeLibs)/) {
                candidate.dependsOn(':rclone:buildAll')
            }
            if (candidate.name ==~ /merge.*Assets/) {
                candidate.dependsOn(':rclone:generateProvenance')
            }
        }
    }

    namespace 'ca.pkay.rcloneexplorer'

    // https://android.izzysoft.de/articles/named/iod-scan-apkchecks#blobs
    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.vectordrawable:vectordrawable:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.leinardi.android:speed-dial:3.3.0'
    implementation 'org.markdownj:markdownj-core:0.4'
    implementation 'jp.wasabeef:recyclerview-animators:4.0.2'
    implementation 'com.github.GrenderG:Toasty:1.5.2'

    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.datastore:datastore-preferences:1.1.0'

    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3")

    // Coroutines + lifecycle scopes (used by WorkManager CoroutineWorker and the AsyncTask migration)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'


    // Thumbnails
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.preference:preference:1.2.1'
    // REST Client
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    debugImplementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    // JSON
    implementation 'com.fasterxml.jackson.core:jackson-core:2.14.1'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.14.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.14.1'
    // Timestmps
    implementation 'com.github.x0b:rfc3339parser:2.0.0'
    // SAF/WebDAV
    implementation project(':safdav')
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // Java 8+ library support
    // TODO: replace with coreLibraryDesugar once available
    implementation 'net.sourceforge.streamsupport:android-retrostreams:1.7.4'
    implementation 'net.sourceforge.streamsupport:android-retrofuture:1.7.4'
    // App intro
    implementation 'com.github.AppIntro:AppIntro:6.3.1'
    // TEST
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // Splash screen
    implementation("androidx.core:core-splashscreen:1.0.1")
}
