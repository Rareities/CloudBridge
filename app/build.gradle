apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlinx-serialization'

android {
    // Release signing: credentials come from a git-ignored keystore.properties
    // (local builds) or CB_* env vars (CI). Release builds never use the debug key.
    def keystoreProperties = new Properties()
    def keystorePropertiesFile = rootProject.file("keystore.properties")
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }
    def releaseStorePath = keystoreProperties['storeFile'] ?: System.getenv('CB_STORE_FILE')
    def releaseKeyConfigured = releaseStorePath != null && file(releaseStorePath).exists()
    signingConfigs {
        release {
            if (releaseKeyConfigured) {
                keyAlias = keystoreProperties['keyAlias'] ?: System.getenv('CB_KEY_ALIAS')
                storeFile file(releaseStorePath)
                storePassword = keystoreProperties['storePassword'] ?: System.getenv('CB_STORE_PASSWORD')
                keyPassword = keystoreProperties['keyPassword'] ?: System.getenv('CB_KEY_PASSWORD')
            }
        }
    }
    ndkVersion project.properties['de.schuelken.cloudbridge.ndkVersion']
    defaultConfig {
        generatedDensities = []
        vectorDrawables.generatedDensities = []
        applicationId 'de.schuelken.cloudbridge'
        minSdkVersion 23
        compileSdk 36
        targetSdkVersion 36
        // Version and ABI-safe base code are promoted together in gradle.properties.
        // versionCode must end in 0 (last digit reserved for ABI offsets).
        versionCode project.property('de.schuelken.cloudbridge.versionCode').toInteger()
        versionName project.property('de.schuelken.cloudbridge.versionName')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "java.lang.String", "CLI", System.getenv('RCX_BUILD_CLI') ? System.getenv('RCX_BUILD_CLI') : "\"c03129b6-b09f-9cb4-8fcd-7f143b8f94ef\""
        buildConfigField "java.lang.String", "VCP_AUTHORITY", "\"" + applicationId + ".vcp\"";
        buildConfigField "java.lang.String", "RCLONE_SOURCE_SHA", "\"" + project.properties['de.schuelken.cloudbridge.rCloneRef'] + "\""
        setProperty("archivesBaseName",  "cloudbridge_v"+versionName)

        externalNativeBuild {
            ndkBuild {
                arguments "LOCAL_LDFLAGS += -Wl,--build-id=none"
            }
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            manifestPlaceholders = [
                    appIcon: "@mipmap/ic_launcher_debug",
                    appIconRound: "@mipmap/ic_launcher_debug_round"
            ]
        }
        release {
            minifyEnabled true
            shrinkResources true
            // Strip debug symbols from the packaged .so files; Play Console
            // extracts them for native (librclone) crash/ANR symbolization.
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [
                    appIcon: "@mipmap/ic_launcher",
                    appIconRound: "@mipmap/ic_launcher_round"
            ]
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main.assets.srcDir "$buildDir/generated/rcloneAssets"
        configureEach {
            jniLibs.srcDirs = ["lib"]
        }
    }

    flavorDimensions += 'edition'
    productFlavors {
        // Round-Sync edition flavor (currently identical to oss, kept for compatibility)
        rs {
            dimension 'edition'
        }
        // OSS build — the default for GitHub releases and Google Play
        oss {
            dimension 'edition'
        }
    }

    splits {
        abi {
            // AAB builds fail while APK splits are enabled; pass -PnoAbiSplits for bundleOssRelease
            enable !project.hasProperty('noAbiSplits')
            reset()
            include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }

    project.ext.versionCodes = [
        'armeabi-v7a': 6,
        'arm64-v8a'  : 7,
        'x86'        : 8,
        'x86_64'     : 9
    ]

    android.applicationVariants.all { variant ->
        variant.outputs.each { output ->
            output.versionCodeOverride =
                    project.ext.versionCodes.get(output.getFilter(com.android.build.OutputFile.ABI), 0) + android.defaultConfig.versionCode
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }
    packagingOptions {
        jniLibs {
            keepDebugSymbols += ['**/*.so']
            useLegacyPackaging true
        }
    }

    // Required for language picker
    androidResources {
        generateLocaleConfig true
    }

    buildTypes {
        getByName("debug") {
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-DEBUG"
            buildConfigField "java.lang.String", "VCP_AUTHORITY", "\"" + defaultConfig.applicationId + ".debug.vcp\"";
            resValue("string", "app_name", "CB Debug")
            resValue("string", "app_short_name", "CB Debug")
        }
    }

    lint {
        baseline = file("lint-baseline.xml")
        abortOnError = true
        warning 'MissingTranslation'

    }

    gradle.projectsEvaluated {
        preBuild.dependsOn(':rclone:buildAll')
        tasks.matching { it.name.startsWith('merge') &&
                (it.name.endsWith('NativeLibs') || it.name.endsWith('JniLibFolders')) }.configureEach {
            dependsOn(':rclone:buildAll')
            inputs.property('approvedNativeCommit', project.properties['de.schuelken.cloudbridge.rCloneRef'])
            inputs.files(fileTree('lib').matching { include '**/librclone.so' })
                    .withPropertyName('generatedRcloneBinaries')
        }
        def releaseSigningCheck = tasks.register('verifyReleaseSigning') {
            doLast {
                def signing = android.signingConfigs.release
                if (signing.storeFile == null || !signing.storeFile.isFile() ||
                        !signing.storePassword || !signing.keyAlias || !signing.keyPassword) {
                    throw new GradleException('Release signing is incomplete. Configure the release keystore, or build assembleOssDebug.')
                }
                def expected = (System.getenv('CB_SIGNING_CERT_SHA256') ?: keystoreProperties['certificateSha256'] ?: '')
                        .replace(':', '').toLowerCase(java.util.Locale.ROOT)
                if (!(expected ==~ /[0-9a-f]{64}/))
                    throw new GradleException('Set the expected release certificate SHA-256 in CB_SIGNING_CERT_SHA256 or certificateSha256.')
                def store = java.security.KeyStore.getInstance(signing.storeType ?: java.security.KeyStore.getDefaultType())
                signing.storeFile.withInputStream { store.load(it, signing.storePassword.toCharArray()) }
                def certificate = store.getCertificate(signing.keyAlias)
                if (certificate == null) throw new GradleException('The configured release signing alias has no certificate.')
                def digest = java.security.MessageDigest.getInstance('SHA-256').digest(certificate.encoded)
                        .collect { String.format('%02x', it & 0xff) }.join('')
                if (digest != expected || certificate.toString().contains('CN=Android Debug'))
                    throw new GradleException('The release signing certificate does not match the approved identity.')
            }
        }
        // AGP omits validateSigning when no signing inputs are configured.
        // The independent guard must also precede every release pre-build.
        tasks.matching {
            (it.name.startsWith('pre') && it.name.endsWith('ReleaseBuild')) ||
                (it.name.startsWith('validateSigning') && it.name.endsWith('Release'))
        }.configureEach { dependsOn(releaseSigningCheck) }
    }

    namespace 'ca.pkay.rcloneexplorer'
    testOptions {
        unitTests.includeAndroidResources = true
    }
    // Opt-in signed release instrumentation, restricted by the fixture to a
    // disposable emulator. The shipped application remains non-debuggable.
    testBuildType project.hasProperty('acceptanceRelease') ? 'release' : 'debug'

    // https://android.izzysoft.de/articles/named/iod-scan-apkchecks#blobs
    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }
}

// Verify packaged bytes, not just BuildConfig or a provenance label. This also
// detects interrupted builds which left an old merged-native-libraries output.
tasks.register('verifyDebugApkEngines') {
    dependsOn 'packageOssDebug'
    doLast {
        def apks = fileTree("$buildDir/outputs/apk/oss/debug").matching { include '*.apk' }.files
        if (apks.isEmpty()) throw new GradleException('No debug APKs were produced')
        apks.each { apk ->
            new java.util.zip.ZipFile(apk).withCloseable { zip ->
                def record = zip.getEntry('assets/engine-provenance.json')
                if (record == null || record.size > 65536) throw new GradleException('Missing packaged provenance')
                def provenance = zip.getInputStream(record).withCloseable {
                    new groovy.json.JsonSlurper().parse(it)
                }
                if (provenance.commit != project.properties['de.schuelken.cloudbridge.rCloneRef'])
                    throw new GradleException('Packaged engine source differs from the approved pin')
                def libraries = java.util.Collections.list(zip.entries()).findAll { it.name ==~ /lib\/[^\/]+\/librclone\.so/ }
                if (!(libraries.size() in [1,4])) throw new GradleException('Incomplete native APK contents')
                libraries.each { lib ->
                    def abi = lib.name.split('/')[1]
                    def expected = provenance.artifacts.find { it.abi == abi }
                    def digest = java.security.MessageDigest.getInstance('SHA-256')
                    zip.getInputStream(lib).withCloseable { input ->
                        byte[] buffer = new byte[65536]; int count
                        while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
                    }
                    def actual = digest.digest().collect { String.format('%02x', it & 0xff) }.join('')
                    if (expected == null || expected.bytes != lib.size || expected.sha256 != actual)
                        throw new GradleException("Packaged engine hash mismatch: ${apk.name} / ${abi}")
                }
            }
        }
    }
}
tasks.matching { it.name == 'assembleOssDebug' }.configureEach { dependsOn 'verifyDebugApkEngines' }

repositories {
    mavenCentral()
    google()
}

dependencies {
    implementation 'net.lingala.zip4j:zip4j:2.11.6'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.vectordrawable:vectordrawable:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.leinardi.android:speed-dial:3.3.0'
    implementation 'org.markdownj:markdownj-core:0.4'
    implementation 'jp.wasabeef:recyclerview-animators:4.0.2'
    implementation 'com.github.GrenderG:Toasty:1.5.2'

    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.datastore:datastore-preferences:1.1.0'

    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3")

    // Coroutines + lifecycle scopes (used by WorkManager CoroutineWorker and the AsyncTask migration)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'


    // Thumbnails
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.work:work-runtime-ktx:2.10.5'
    implementation 'androidx.preference:preference:1.2.1'
    // REST Client
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    debugImplementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    // JSON
    implementation 'com.fasterxml.jackson.core:jackson-core:2.14.1'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.14.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.14.1'
    // Timestmps
    implementation 'com.github.x0b:rfc3339parser:2.0.0'
    // SAF/WebDAV
    implementation project(':safdav')
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // Java 8+ library support
    // TODO: replace with coreLibraryDesugar once available
    implementation 'net.sourceforge.streamsupport:android-retrostreams:1.7.4'
    implementation 'net.sourceforge.streamsupport:android-retrofuture:1.7.4'
    // App intro
    implementation 'com.github.AppIntro:AppIntro:6.3.1'
    // TEST
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.work:work-testing:2.10.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.work:work-testing:2.10.5'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'

    // Splash screen
    implementation("androidx.core:core-splashscreen:1.0.1")
}
